name: .NET 10 SDK qualification

on:
  push:
    branches: [main, 'migration/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.configuration }}
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Restore, build, ABI tests, pack, and consume packages
        shell: pwsh
        run: ./build.ps1 -Configuration ${{ matrix.configuration }}
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.configuration }}
          path: |
            artifacts/build.binlog
            artifacts/test-results/**
            artifacts/packages/**
          if-no-files-found: warn

  interop-aot:
    name: Native COM JIT and AOT (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Native fixture and managed/AOT ownership qualification
        shell: pwsh
        run: ./build/VerifyInterop.ps1 -Configuration Release -PublishAot
      - name: WARP swap-chain resize qualification
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet run --project samples/ModernTriangle -c Debug -- --warp --resize-test --evidence=artifacts/triangle-resize
      - name: WARP compute and DirectML numerical qualification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet run --project samples/ModernCompute -c Debug -- --warp --directml
          if ($LASTEXITCODE -ne 0) { throw 'JIT numerical qualification failed.' }
          dotnet publish samples/ModernCompute -c Release -r win-x64 -p:PublishAot=true -o artifacts/modern-compute-aot
          if ($LASTEXITCODE -ne 0) { throw 'NativeAOT compute publish failed.' }
          & ./artifacts/modern-compute-aot/ModernCompute.exe --warp --directml --no-debug
          if ($LASTEXITCODE -ne 0) { throw 'NativeAOT numerical qualification failed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interop-${{ matrix.os }}
          path: |
            artifacts/qualification-aot/**
            artifacts/modern-compute-aot/**
            artifacts/triangle-resize/**
          if-no-files-found: warn
